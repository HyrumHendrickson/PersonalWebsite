<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Is, Ea, Id — Latin Pronoun Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  .latin-app {

  .eyebrow {

  .panel-corner.tl { top: 6px; left: 6px; border-right: none; border-bottom: none; }
  .panel-corner.tr { top: 6px; right: 6px; border-left: none; border-bottom: none; }
  .panel-corner.bl { bottom: 6px; left: 6px; border-right: none; border-top: none; }

  .panel-header { text-align: center; margin-bottom: 1.5rem; }

  .flashcard-wrap { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }

  .flashcard-inner {

  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
  .flashcard-face {

    display: block;
    font-family: 'EB Garamond', serif;

  .options {

  @media (max-width: 480px) { .options { grid-template-columns: 1fr; } }
  .option {
    background: rgba(245, 239, 225, 0.75);

  .paradigm-table th {

    font-weight: 500;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: var(--ink-soft);

    text-align: left;

    font-family: 'EB Garamond', serif;
    font-style: italic;

  .paradigm-table td.case-td {
    text-align: left;
    padding-left: 1rem;
    font-style: italic;
    color: var(--ink-soft);
    background: rgba(138, 106, 46, 0.04);
    font-size: 1.05rem;
  }
  .paradigm-latin {
    font-family: 'EB Garamond', serif;
    font-style: italic;

  .paradigm-variant {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 0.85rem;
    color: var(--ink-soft);

  .match-board {

  .match-column-label {
    font-family: 'Cinzel', serif;

    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--bronze);
    text-align: center;
    margin-bottom: 0.5rem;
  }
  .match-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .match-tile {
    background: rgba(245, 239, 225, 0.75);
    border: 1px solid rgba(31, 26, 20, 0.25);
    padding: 0.85rem 1rem;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    font-family: 'EB Garamond', serif;
    color: var(--ink);
    min-height: 3.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  .match-tile.latin {
    font-size: 1.5rem;
    color: var(--porphyry);
    font-style: italic;
    font-weight: 500;
  }
  .match-tile.label { font-size: 1rem; font-style: italic; }
  .match-tile:hover:not(:disabled):not(.matched) {

  .victory { text-align: center; padding: 1.5rem 1rem; margin-top: 1rem; }
  .victory-title {

  .colophon {
    text-align: center;
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(138, 106, 46, 0.3);
    font-family: 'Cinzel', serif;
    font-weight: 400;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
</style>

<body>
<div class="latin-app">
  <div class="container">
    <header class="masthead">
      <div class="eyebrow">Pronomen · Lingua Latina</div>
      <h1 class="title"><em>Is · Ea · Id</em></h1>
      <p class="subtitle">A study apparatus for the Latin demonstrative pronoun in all cases and numbers</p>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <div id="panel-root"></div>

    <footer class="colophon">Is · Ea · Id · A study apparatus for the Latin pronoun</footer>
  </div>
</div>

<script>
'use strict';

// ─── DATA ─────────────────────────────────────────────────────────────────
const FORMS = [
  // SINGULAR — Masculine
  { form: "is",    gender: "Masculine", number: "Singular", case: "Nominative", gloss: "he, this/that man" },
  { form: "eius",  gender: "Masculine", number: "Singular", case: "Genitive",   gloss: "of him, his" },
  { form: "ei",    gender: "Masculine", number: "Singular", case: "Dative",     gloss: "to/for him" },
  { form: "eum",   gender: "Masculine", number: "Singular", case: "Accusative", gloss: "him" },
  { form: "eo",    gender: "Masculine", number: "Singular", case: "Ablative",   gloss: "by/with/from him" },
  // SINGULAR — Feminine
  { form: "ea",    gender: "Feminine",  number: "Singular", case: "Nominative", gloss: "she, this/that woman" },
  { form: "eius",  gender: "Feminine",  number: "Singular", case: "Genitive",   gloss: "of her, her" },
  { form: "ei",    gender: "Feminine",  number: "Singular", case: "Dative",     gloss: "to/for her" },
  { form: "eam",   gender: "Feminine",  number: "Singular", case: "Accusative", gloss: "her" },
  { form: "ea",    gender: "Feminine",  number: "Singular", case: "Ablative",   gloss: "by/with/from her" },
  // SINGULAR — Neuter
  { form: "id",    gender: "Neuter",    number: "Singular", case: "Nominative", gloss: "it, this/that thing" },
  { form: "eius",  gender: "Neuter",    number: "Singular", case: "Genitive",   gloss: "of it, its" },
  { form: "ei",    gender: "Neuter",    number: "Singular", case: "Dative",     gloss: "to/for it" },
  { form: "id",    gender: "Neuter",    number: "Singular", case: "Accusative", gloss: "it" },
  { form: "eo",    gender: "Neuter",    number: "Singular", case: "Ablative",   gloss: "by/with/from it" },
  // PLURAL — Masculine
  { form: "ei",    gender: "Masculine", number: "Plural",   case: "Nominative", gloss: "they, those men", variant: "ii" },
  { form: "eorum", gender: "Masculine", number: "Plural",   case: "Genitive",   gloss: "of them, their" },
  { form: "eis",   gender: "Masculine", number: "Plural",   case: "Dative",     gloss: "to/for them", variant: "iis" },
  { form: "eos",   gender: "Masculine", number: "Plural",   case: "Accusative", gloss: "them" },
  { form: "eis",   gender: "Masculine", number: "Plural",   case: "Ablative",   gloss: "by/with/from them", variant: "iis" },
  // PLURAL — Feminine
  { form: "eae",   gender: "Feminine",  number: "Plural",   case: "Nominative", gloss: "they, those women" },
  { form: "earum", gender: "Feminine",  number: "Plural",   case: "Genitive",   gloss: "of them, their" },
  { form: "eis",   gender: "Feminine",  number: "Plural",   case: "Dative",     gloss: "to/for them", variant: "iis" },
  { form: "eas",   gender: "Feminine",  number: "Plural",   case: "Accusative", gloss: "them" },
  { form: "eis",   gender: "Feminine",  number: "Plural",   case: "Ablative",   gloss: "by/with/from them", variant: "iis" },
  // PLURAL — Neuter
  { form: "ea",    gender: "Neuter",    number: "Plural",   case: "Nominative", gloss: "they, those things" },
  { form: "eorum", gender: "Neuter",    number: "Plural",   case: "Genitive",   gloss: "of them, their" },
  { form: "eis",   gender: "Neuter",    number: "Plural",   case: "Dative",     gloss: "to/for them", variant: "iis" },
  { form: "ea",    gender: "Neuter",    number: "Plural",   case: "Accusative", gloss: "them" },
  { form: "eis",   gender: "Neuter",    number: "Plural",   case: "Ablative",   gloss: "by/with/from them", variant: "iis" },
];

const STUDY_SET = FORMS;
const CASES = ["Nominative", "Genitive", "Dative", "Accusative", "Ablative"];
const GENDERS = ["Masculine", "Feminine", "Neuter"];
const NUMBERS = ["Singular", "Plural"];

// ─── UTILITIES ──────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function equivalentParse(a, b) {
  return a.form === b.form && a.case === b.case && a.number === b.number;
}

function allParsingsOf(article) {
  return STUDY_SET.filter((a) => a.form === article.form);
}

function allCaseNumberSlots(form) {
  const seen = new Set();
  const out = [];
  for (const a of STUDY_SET.filter((x) => x.form === form)) {
    const key = a.case + "-" + a.number;
    if (!seen.has(key)) { seen.add(key); out.push({ case: a.case, number: a.number }); }
  }
  return out;
}

function uniqueForms(articles) {
  const seen = new Set();
  const out = [];
  for (const a of articles) {
    if (!seen.has(a.form)) { seen.add(a.form); out.push(a); }
  }
  return out;
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.startsWith("on") && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
  }
  (children || []).forEach((c) => {
    if (c === null || c === undefined) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}

function panelFrame(title, meta, contentEl) {
  const panel = el("section", { class: "panel" }, [
    el("span", { class: "panel-corner tl" }),
    el("span", { class: "panel-corner tr" }),
    el("span", { class: "panel-corner bl" }),
    el("span", { class: "panel-corner br" }),
    el("div", { class: "panel-header" }, [
      el("h2", { class: "panel-title" }, [title]),
      el("div", { class: "panel-meta" }, [meta]),
    ]),
    contentEl,
  ]);
  return panel;
}

const root = document.getElementById("panel-root");
function renderPanel(node) {
  root.innerHTML = "";
  root.appendChild(node);
}

// ─── FLASHCARD MODE ─────────────────────────────────────────────────────────
const flashState = { deck: shuffle(STUDY_SET), index: 0, flipped: false, direction: "latin-first" };

function renderFlashcards() {
  const card = flashState.deck[flashState.index];
  const isSyncretic = allParsingsOf(card).length > 1;

  const frontInner = flashState.direction === "latin-first"
    ? el("span", { class: "flashcard-latin" }, [card.form])
    : el("span", { class: "flashcard-prompt" }, [
        el("em", {}, [card.case]), el("br"), document.createTextNode(card.gender + " · " + card.number),
      ]);

  const front = el("div", { class: "flashcard-face" }, [frontInner, el("span", { class: "flashcard-hint" }, ["Tap to reveal"])]);

  let backChildren;
  if (flashState.direction === "latin-first") {
    backChildren = [
      el("span", { class: "flashcard-prompt" }, [el("em", {}, [card.case]), el("br"), document.createTextNode(card.gender + " · " + card.number)]),
      el("span", { class: "flashcard-gloss" }, [card.gloss]),
    ];
    if (isSyncretic) {
      const others = allParsingsOf(card)
        .filter((p) => !(p.case === card.case && p.gender === card.gender && p.number === card.number))
        .map((p) => p.case.slice(0, 3) + ". " + p.gender[0] + " " + p.number.slice(0, 2) + ".")
        .join(" / ");
      backChildren.push(el("span", { class: "flashcard-syncretic" }, ["Also: " + others]));
    }
  } else {
    backChildren = [el("span", { class: "flashcard-latin" }, [card.form])];
    if (card.variant) backChildren.push(el("span", { class: "flashcard-syncretic" }, ["variant: " + card.variant]));
  }
  const back = el("div", { class: "flashcard-face back" }, backChildren);

  const inner = el("div", { class: "flashcard-inner" }, [front, back]);
  const flashcard = el("div", { class: "flashcard" + (flashState.flipped ? " flipped" : "") }, [inner]);
  flashcard.addEventListener("click", () => { flashState.flipped = !flashState.flipped; renderFlashcards(); });

  const next = () => { flashState.flipped = false; setTimeout(() => { flashState.index = (flashState.index + 1) % flashState.deck.length; renderFlashcards(); }, 200); };
  const prev = () => { flashState.flipped = false; setTimeout(() => { flashState.index = (flashState.index - 1 + flashState.deck.length) % flashState.deck.length; renderFlashcards(); }, 200); };
  const reshuffle = () => { flashState.flipped = false; flashState.deck = shuffle(STUDY_SET); flashState.index = 0; renderFlashcards(); };
  const toggleDir = () => { flashState.flipped = false; flashState.direction = flashState.direction === "latin-first" ? "label-first" : "latin-first"; renderFlashcards(); };

  const wrap = el("div", { class: "flashcard-wrap" }, [
    flashcard,
    el("div", { class: "nav-row" }, [
      el("button", { class: "btn", onclick: prev }, ["‹ Previous"]),
      el("button", { class: "btn primary", onclick: () => { flashState.flipped = !flashState.flipped; renderFlashcards(); } }, [flashState.flipped ? "Hide" : "Reveal"]),
      el("button", { class: "btn", onclick: next }, ["Next ›"]),
    ]),
    el("div", { class: "nav-row" }, [
      el("button", { class: "btn bronze", onclick: toggleDir }, [flashState.direction === "latin-first" ? "Switch: Label → Latin" : "Switch: Latin → Label"]),
      el("button", { class: "btn bronze", onclick: reshuffle }, ["Reshuffle Deck"]),
    ]),
  ]);

  renderPanel(panelFrame("Flashcards", "Card " + (flashState.index + 1) + " of " + flashState.deck.length, wrap));
}

// ─── QUIZ MODE ──────────────────────────────────────────────────────────────
const quizState = { direction: "form-to-label", question: null, choices: [], selected: null, score: { correct: 0, total: 0 } };

function generateQuestion() {
  const dir = quizState.direction;
  const answer = STUDY_SET[Math.floor(Math.random() * STUDY_SET.length)];
  let options;

  if (dir === "form-to-label") {
    const wrongPool = STUDY_SET.filter((a) => a.form !== answer.form);
    const distractors = [];
    const seenSlots = new Set([answer.case + "-" + answer.gender + "-" + answer.number]);
    for (const a of shuffle(wrongPool)) {
      if (distractors.length >= 3) break;
      const key = a.case + "-" + a.gender + "-" + a.number;
      if (!seenSlots.has(key)) { distractors.push(a); seenSlots.add(key); }
    }
    options = shuffle([answer].concat(distractors));
  } else {
    const wrongPool = STUDY_SET.filter((a) => a.form !== answer.form);
    const distinctWrong = uniqueForms(shuffle(wrongPool));
    options = shuffle([answer].concat(distinctWrong.slice(0, 3)));
  }

  quizState.question = Object.assign({}, answer, { direction: dir });
  quizState.choices = options;
  quizState.selected = null;
}

function isCorrectChoice(c) {
  const q = quizState.question;
  return quizState.direction === "form-to-label" ? equivalentParse(c, q) : c.form === q.form;
}

function renderQuiz() {
  const q = quizState.question;
  const pct = quizState.score.total ? Math.round((quizState.score.correct / quizState.score.total) * 100) : 0;

  const statsRow = el("div", { class: "quiz-stats" }, [
    el("span", {}, ["Correct: ", el("strong", {}, [String(quizState.score.correct)])]),
    el("span", {}, ["Asked: ", el("strong", {}, [String(quizState.score.total)])]),
    el("span", {}, ["Accuracy: ", el("strong", {}, [pct + "%"])]),
  ]);

  const setDir = (d) => {
    if (quizState.direction === d) return;
    quizState.direction = d;
    generateQuestion();
    renderQuiz();
  };
  const resetScore = () => { quizState.score = { correct: 0, total: 0 }; renderQuiz(); };

  const dirRow = el("div", { class: "nav-row", style: "margin-bottom:1rem;" }, [
    el("button", { class: "btn bronze", onclick: () => setDir("form-to-label"), disabled: quizState.direction === "form-to-label" ? "true" : null }, ["Form → Identify"]),
    el("button", { class: "btn bronze", onclick: () => setDir("label-to-form"), disabled: quizState.direction === "label-to-form" ? "true" : null }, ["Identify → Form"]),
    el("button", { class: "btn bronze", onclick: resetScore }, ["Reset Score"]),
  ]);
  if (quizState.direction === "form-to-label") dirRow.children[0].disabled = true;
  if (quizState.direction === "label-to-form") dirRow.children[1].disabled = true;

  let promptEl;
  if (quizState.direction === "form-to-label") {
    promptEl = el("div", { class: "quiz-prompt" }, ["Parse this pronoun:", el("span", { class: "big" }, [q.form])]);
  } else {
    promptEl = el("div", { class: "quiz-prompt" }, ["Give the form for ", el("em", {}, [q.case + " " + q.gender + " " + q.number])]);
  }

  const choose = (c) => {
    if (quizState.selected) return;
    quizState.selected = c;
    const correct = isCorrectChoice(c);
    quizState.score.total += 1;
    if (correct) quizState.score.correct += 1;
    renderQuiz();
  };

  const optionsGrid = el("div", { class: "options" }, quizState.choices.map((c) => {
    const correct = isCorrectChoice(c);
    const picked = quizState.selected === c;
    let cls = "option" + (quizState.direction === "label-to-form" ? " italic" : "");
    if (quizState.selected) {
      if (correct) cls += " correct";
      else if (picked) cls += " incorrect";
    }
    const label = quizState.direction === "form-to-label" ? (c.case + " · " + c.gender + " " + c.number) : c.form;
    const btn = el("button", { class: cls, onclick: () => choose(c) }, [label]);
    if (quizState.selected) btn.disabled = true;
    return btn;
  }));

  const panelChildren = [statsRow, dirRow, promptEl, optionsGrid];

  if (quizState.selected) {
    const correct = isCorrectChoice(quizState.selected);
    let text;
    if (correct) {
      const parsings = allParsingsOf(q);
      if (quizState.direction === "form-to-label" && parsings.length > 1) {
        const matchingGenders = parsings.filter((p) => p.case === q.case && p.number === q.number).map((p) => p.gender);
        if (matchingGenders.length > 1) {
          text = 'Recte! "' + q.form + '" is ' + q.case + " " + q.number + " — valid for " + matchingGenders.join(", ") + ".";
        }
      }
      if (!text) text = 'Recte! "' + q.form + '" — ' + q.case + ", " + q.gender + ", " + q.number + ".";
    } else if (quizState.direction === "form-to-label") {
      const slots = allCaseNumberSlots(q.form);
      const description = slots.map((s) => {
        const genders = allParsingsOf(q).filter((p) => p.case === s.case && p.number === s.number).map((p) => p.gender[0]).join("/");
        return s.case + " " + s.number + " (" + genders + ")";
      }).join(" or ");
      text = 'Not quite. "' + q.form + '" can be parsed as: ' + description + ".";
    } else {
      text = "Not quite. The form for " + q.case + " " + q.gender + " " + q.number + ' is "' + q.form + '".';
    }

    panelChildren.push(el("div", { class: "feedback " + (correct ? "correct" : "incorrect") }, [text]));
    panelChildren.push(el("div", { class: "nav-row", style: "margin-top:1rem;" }, [
      el("button", { class: "btn primary", onclick: () => { generateQuestion(); renderQuiz(); } }, ["Next Question ›"]),
    ]));
  }

  const content = el("div", {}, panelChildren);
  renderPanel(panelFrame("Quiz", "Multiple choice · advances with Next", content));
}

// ─── BROWSE MODE ────────────────────────────────────────────────────────────
function getCell(num, gen, cs) {
  return STUDY_SET.find((a) => a.number === num && a.gender === gen && a.case === cs);
}

function renderTable(num) {
  const thead = el("thead", {}, [
    el("tr", {}, [el("th", { class: "case-th" }, ["Case"])].concat(GENDERS.map((g) => el("th", {}, [g])))),
  ]);
  const tbody = el("tbody", {}, CASES.map((cs) => {
    const cells = GENDERS.map((g) => {
      const cell = getCell(num, g, cs);
      if (!cell) return el("td", {}, ["—"]);
      const children = [el("span", { class: "paradigm-latin" }, [cell.form])];
      if (cell.variant) children.push(el("span", { class: "paradigm-variant" }, ["or " + cell.variant]));
      return el("td", {}, children);
    });
    return el("tr", {}, [el("td", { class: "case-td" }, [cs])].concat(cells));
  }));
  return el("div", { class: "paradigm-section" }, [
    el("div", { class: "paradigm-label" }, [num]),
    el("table", { class: "paradigm-table" }, [thead, tbody]),
  ]);
}

function renderBrowse() {
  const tables = NUMBERS.map(renderTable);
  const note = el("div", { style: "margin-top:1.5rem; font-size:0.95rem; color:var(--ink-soft); max-width:780px; margin-left:auto; margin-right:auto;" }, [
    el("p", { style: "text-align:center; font-style:italic;" }, [
      el("em", {}, ["Is, ea, id"]),
      " functions as both the third-person personal pronoun and a weak demonstrative (\"that, this\"). Note the syncretisms: ",
      el("em", {}, ["eius"]), " is genitive singular for all three genders; ",
      el("em", {}, ["ei"]), " is dative singular for all three genders (and also masc. nom. pl.); ",
      el("em", {}, ["eis"]), " covers dative and ablative plural for all three genders.",
    ]),
    el("p", { style: "text-align:center; font-style:italic; margin-top:0.75rem;" }, [
      "The variants ", el("em", {}, ["ii"]), " (m. nom. pl.) and ", el("em", {}, ["iis"]),
      " (dat./abl. pl.) are older forms still seen in classical authors and many editions.",
    ]),
  ]);
  const content = el("div", {}, tables.concat([note]));
  renderPanel(panelFrame("Paradigm", "The full declension at a glance", content));
}

// ─── MATCH MODE ─────────────────────────────────────────────────────────────
const ROUND_SIZE = 6;
const matchState = {};

function buildRound() {
  const picks = uniqueForms(shuffle(STUDY_SET)).slice(0, ROUND_SIZE);
  matchState.pairs = picks.map((p, i) => Object.assign({ id: i }, p));
  matchState.latinTiles = shuffle(matchState.pairs.slice());
  matchState.labelTiles = shuffle(matchState.pairs.slice());
  matchState.matched = new Set();
  matchState.selLatin = null;
  matchState.selLabel = null;
  matchState.attempts = 0;
  matchState.wrong = 0;
  matchState.flash = { ids: [], kind: null };
}

function renderMatch() {
  const done = matchState.matched.size === ROUND_SIZE;

  const statsRow = el("div", { class: "quiz-stats" }, [
    el("span", {}, ["Attempts: ", el("strong", {}, [String(matchState.attempts)])]),
    el("span", {}, ["Errors: ", el("strong", {}, [String(matchState.wrong)])]),
  ]);

  function tileClass(id, side) {
    let cls = "match-tile " + side;
    if (matchState.matched.has(id)) cls += " matched";
    else if ((side === "latin" && matchState.selLatin === id) || (side === "label" && matchState.selLabel === id)) cls += " selected";
    if (matchState.flash.ids.includes(id)) cls += matchState.flash.kind === "correct" ? " flash-correct" : " flash-wrong";
    return cls;
  }

  function pickLatin(id) {
    if (matchState.flash.kind !== null || matchState.matched.has(id)) return;
    matchState.selLatin = id;
    checkPair();
  }
  function pickLabel(id) {
    if (matchState.flash.kind !== null || matchState.matched.has(id)) return;
    matchState.selLabel = id;
    checkPair();
  }
  function checkPair() {
    if (matchState.selLatin === null || matchState.selLabel === null) { renderMatch(); return; }
    matchState.attempts += 1;
    if (matchState.selLatin === matchState.selLabel) {
      matchState.flash = { ids: [matchState.selLatin], kind: "correct" };
      renderMatch();
      setTimeout(() => {
        matchState.matched.add(matchState.selLatin);
        matchState.selLatin = null;
        matchState.selLabel = null;
        matchState.flash = { ids: [], kind: null };
        renderMatch();
      }, 400);
    } else {
      matchState.wrong += 1;
      matchState.flash = { ids: [matchState.selLatin, matchState.selLabel], kind: "wrong" };
      renderMatch();
      setTimeout(() => {
        matchState.selLatin = null;
        matchState.selLabel = null;
        matchState.flash = { ids: [], kind: null };
        renderMatch();
      }, 600);
    }
  }

  const latinCol = el("div", {}, [
    el("div", { class: "match-column-label" }, ["Latin"]),
    el("div", { class: "match-list" }, matchState.latinTiles.map((t) =>
      el("button", { class: tileClass(t.id, "latin"), onclick: () => pickLatin(t.id) }, [t.form])
    )),
  ]);
  const labelCol = el("div", {}, [
    el("div", { class: "match-column-label" }, ["Parsing"]),
    el("div", { class: "match-list" }, matchState.labelTiles.map((t) =>
      el("button", { class: tileClass(t.id, "label"), onclick: () => pickLabel(t.id) }, [t.case + " · " + t.gender + " " + (t.number === "Plural" ? "Pl." : "Sg.")])
    )),
  ]);
  const board = el("div", { class: "match-board" }, [latinCol, labelCol]);

  const children = [statsRow, board];

  if (done) {
    children.push(el("div", { class: "victory" }, [
      el("h3", { class: "victory-title" }, ["Optimē!"]),
      el("p", { class: "victory-text" }, ["Round complete in " + matchState.attempts + " attempts (" + matchState.wrong + " " + (matchState.wrong === 1 ? "error" : "errors") + ")."]),
      el("button", { class: "btn primary", onclick: () => { buildRound(); renderMatch(); } }, ["New Round ›"]),
    ]));
  } else {
    children.push(el("div", { class: "nav-row", style: "margin-top:1.5rem;" }, [
      el("button", { class: "btn bronze", onclick: () => { buildRound(); renderMatch(); } }, ["Restart Round"]),
    ]));
  }

  const content = el("div", {}, children);
  renderPanel(panelFrame("Match", "Pair Latin forms with their grammatical labels · " + matchState.matched.size + " / " + ROUND_SIZE, content));
}

// ─── TABS / APP ─────────────────────────────────────────────────────────────
const MODES = [
  { id: "flashcard", label: "Flashcards", num: "I", render: renderFlashcards },
  { id: "quiz", label: "Quiz", num: "II", render: () => { generateQuestion(); renderQuiz(); } },
  { id: "browse", label: "Paradigm", num: "III", render: renderBrowse },
  { id: "match", label: "Match", num: "IV", render: () => { buildRound(); renderMatch(); } },
];

let currentMode = "flashcard";

function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  MODES.forEach((m) => {
    const tab = el("button", {
      class: "tab" + (currentMode === m.id ? " active" : ""),
      onclick: () => { currentMode = m.id; renderTabs(); m.render(); },
    }, [el("span", { class: "tab-num" }, [m.num]), m.label]);
    tabsEl.appendChild(tab);
  });
}

renderTabs();
renderFlashcards();
</script>
</body>
</html>
