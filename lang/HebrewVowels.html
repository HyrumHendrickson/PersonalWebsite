<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hebrew Vowels · Hebrew · Lingua Antiqua</title>
<meta name="description" content="Flashcards for the Masoretic vowel points (niqqud): long, short, and reduced vowels with example words.">
<meta name="theme-color" content="#1a1410">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Serif+Hebrew:wght@400;600&family=Noto+Sans+Hebrew:wght@400;700&family=Miriam+Libre:wght@400;700&display=swap" rel="stylesheet">
<script>try{var t=JSON.parse(localStorage.getItem('lingua:theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="assets/lingua.css">
</head>
<body data-section="hebrew" data-app="HebrewVowels">
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>
<nav id="site-breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>
<script src="assets/lingua.js"></script>
<noscript><p class="noscript-note">This application needs JavaScript to run. Please enable it and reload the page.</p></noscript>
<main id="main" class="container app-shell">
  <header class="masthead">
    <div class="eyebrow">Niqqud · Masoretic Pointing</div>
    <h1>The Hebrew <em>Vowels</em></h1>
    <p class="subtitle">The Masoretic pointing system: long, short, and reduced vowels</p>
  </header>

  <section class="panel" aria-labelledby="panel-title">
    <div class="panel-header">
      <h2 class="panel-title" id="panel-title">Flashcards</h2>
      <div class="panel-meta">12 vowel signs</div>
    </div>
    <div class="controls">
      <div class="control-group">
        <span class="label" id="lbl-filter">Show</span>
        <div class="chips" id="filters" role="group" aria-labelledby="lbl-filter">
          <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="chip" data-filter="long" aria-pressed="false">Long vowels</button>
          <button type="button" class="chip" data-filter="short" aria-pressed="false">Short vowels</button>
          <button type="button" class="chip" data-filter="reduced" aria-pressed="false">Reduced / Shva</button>
        </div>
      </div>
      <div class="control-group">
        <span class="label" id="lbl-dir">Direction</span>
        <div class="seg" id="dir" role="group" aria-labelledby="lbl-dir">
          <button type="button" data-mode="symbol" aria-pressed="true">Symbol → Name</button>
          <button type="button" data-mode="name" aria-pressed="false">Name → Symbol</button>
        </div>
      </div>
      <div class="control-group">
        <label class="label" for="font-select">Font</label>
        <select id="font-select" class="field field--select">
          <option value="'Frank Ruhl Libre', 'Times New Roman', serif">Frank Rühl (classic print)</option>
          <option value="'Noto Serif Hebrew', 'David', serif">Noto Serif Hebrew</option>
          <option value="'Noto Sans Hebrew', 'Arial Hebrew', sans-serif">Noto Sans Hebrew</option>
          <option value="'Miriam Libre', 'Courier New', monospace">Miriam (block)</option>
          <option value="'Arial Hebrew', 'Helvetica', sans-serif">System default</option>
        </select>
      </div>
    </div>
    <div id="deck"></div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/flashdeck.js"></script>
<script>
(function () {
  'use strict';
  var L = window.Lingua, h = L.h;
  var FONT_KEY = 'lingua:hebrew-font';
  var deckEl = document.getElementById('deck');
  var fontSel = document.getElementById('font-select');
  var savedFont = L.store.get(FONT_KEY, null);
  if (savedFont) {
    for (var i = 0; i < fontSel.options.length; i++) if (fontSel.options[i].value === savedFont) fontSel.value = savedFont;
  }
  function applyFont() { deckEl.style.setProperty('--font-hebrew', fontSel.value); }
  applyFont();
  fontSel.addEventListener('change', function () { applyFont(); L.store.set(FONT_KEY, fontSel.value); });

  var DC = "\u25CC";

  // Each card has one symbol. Where two names share the same symbol (e.g. Qamats /
  // Qamats Hatuf, Tsere / Tsere Male, Hiriq / Hiriq Male), they are merged into a
  // single card. The `readings` array holds all possible name+sound+type+example
  // combinations for that symbol, rendered together on the back.
  var ALL_VOWELS = [
    // ── LONG / AMBIGUOUS ──
    {
      symbol: DC + "\u05B8",
      category: "long",
      readings: [
        { name: "Qamats",      sound: "AH  (as in 'father')",                              type: "Long A",  example: "שָׁלוֹם  shalom — peace" },
        { name: "Qamats Hatuf",sound: "O  (short) — only in closed unstressed syllable",   type: "Short O", example: "חָכְמָה  hokhmah — wisdom" },
      ]
    },
    {
      symbol: DC + "\u05B5",
      category: "long",
      readings: [
        { name: "Tsere",      sound: "EY  (as in 'they')",                        type: "Long E", example: "אֵם  em — mother" },
        { name: "Tsere Male", sound: "EY — same sound, lengthened by following Yod", type: "Long E", example: "בֵּית  beit — house (written ◌ֵי)" },
      ]
    },
    {
      symbol: DC + "\u05B4",
      category: "long",
      readings: [
        { name: "Hiriq",      sound: "I  (as in 'bit') — short",                     type: "Short I", example: "מִן  min — from" },
        { name: "Hiriq Male", sound: "EE  (as in 'machine') — long, with following Yod", type: "Long I",  example: "שִׁיר  shir — song (written ◌ִי)" },
      ]
    },
    // ── UNIQUE LONG VOWELS ──
    {
      symbol: DC + "\u05B9",
      category: "long",
      readings: [{ name: "Holem", sound: "OH  (as in 'tone')", type: "Long O", example: "כֹּל  kol — all" }]
    },
    {
      symbol: "\u05D5\u05BC",
      category: "long",
      readings: [{ name: "Shuruq", sound: "OO  (as in 'rule') — Vav with dagesh", type: "Long U", example: "רוּחַ  ruach — spirit" }]
    },
    // ── SHORT VOWELS ──
    {
      symbol: DC + "\u05B7",
      category: "short",
      readings: [{ name: "Patah", sound: "A  (as in 'cat')", type: "Short A", example: "בַּיִת  bayit — house" }]
    },
    {
      symbol: DC + "\u05B6",
      category: "short",
      readings: [{ name: "Segol", sound: "E  (as in 'bed')", type: "Short E", example: "מֶלֶךְ  melekh — king" }]
    },
    {
      symbol: DC + "\u05BB",
      category: "short",
      readings: [{ name: "Qibbuts", sound: "U  (as in 'put')", type: "Short U", example: "סֻכָּה  sukkah — booth" }]
    },
    // ── REDUCED / SHVA ──
    {
      symbol: DC + "\u05B0",
      category: "reduced",
      readings: [{ name: "Shva", sound: "Ə  (brief neutral) or silent — depends on syllable position", type: "Reduced", example: "בְּרֵאשִׁית  bereshit — in the beginning" }]
    },
    {
      symbol: DC + "\u05B2",
      category: "reduced",
      readings: [{ name: "Hataf Patah", sound: "A  (ultra-short, as in 'cat')", type: "Reduced A", example: "אֲנִי  ani — I" }]
    },
    {
      symbol: DC + "\u05B1",
      category: "reduced",
      readings: [{ name: "Hataf Segol", sound: "E  (ultra-short, as in 'bed')", type: "Reduced E", example: "אֱלֹהִים  Elohim — God" }]
    },
    {
      symbol: DC + "\u05B3",
      category: "reduced",
      readings: [{ name: "Hataf Qamats", sound: "O  (ultra-short, as in 'not')", type: "Reduced O", example: "אֳנִיָּה  oniyah — ship" }]
    },
  ];

  var mode = 'symbol';
  var filter = 'all';
  document.querySelector('.panel-meta').textContent = ALL_VOWELS.length + ' vowel signs';

  // A card is included in a filter if its category matches or any of its
  // readings is of that type (e.g. Hiriq appears under both long and short).
  function filtered() {
    if (filter === 'all') return ALL_VOWELS.slice();
    return ALL_VOWELS.filter(function (v) {
      return v.category === filter || v.readings.some(function (r) { return r.type.toLowerCase().indexOf(filter) !== -1; });
    });
  }

  function reading(r, multi) {
    return h('div', { class: multi ? 'fc-reading' : '' }, [
      multi ? h('span', { class: 'tag' }, [r.type]) : null,
      multi ? h('strong', null, [r.name]) : h('span', { class: 'fc-back-top' }, [r.name]),
      h('span', multi ? { class: 'sound' } : { class: 'fc-back-detail' }, [r.sound.replace(/\s{2,}/g, ' ')]),
      multi ? null : h('span', { class: 'fc-translit' }, [r.type]),
      h('span', multi ? { class: 'ex', html: L.hebrewRuns(r.example.replace(/\s{2,}/g, ' ')) } : { class: 'fc-note', html: L.hebrewRuns(r.example.replace(/\s{2,}/g, ' ')) })
    ]);
  }

  var deck = L.flashDeck({
    root: '#deck',
    items: filtered(),
    tall: true,
    renderFront: function (v) {
      return mode === 'symbol'
        ? h('span', { class: 'fc-form', lang: 'he' }, [v.symbol])
        : h('span', { class: 'fc-title' }, [v.readings.map(function (r) { return r.name; }).join(' / ')]);
    },
    renderBack: function (v) {
      if (mode === 'symbol') {
        var multi = v.readings.length > 1;
        return multi
          ? h('div', { class: 'fc-readings' }, v.readings.map(function (r) { return reading(r, true); }))
          : reading(v.readings[0], false);
      }
      return [h('span', { class: 'fc-form fc-form--md', lang: 'he' }, [v.symbol])].concat(
        v.readings.map(function (r) { return h('span', { class: 'fc-back-detail' }, [r.sound.replace(/\s{2,}/g, ' ')]); }));
    }
  });

  function press(group, attr, value) {
    Array.prototype.forEach.call(document.querySelectorAll(group + ' button'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute(attr) === value));
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('#dir button'), function (b) {
    b.addEventListener('click', function () {
      mode = b.getAttribute('data-mode');
      press('#dir', 'data-mode', mode);
      deck.setItems(filtered());
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#filters button'), function (b) {
    b.addEventListener('click', function () {
      filter = b.getAttribute('data-filter');
      press('#filters', 'data-filter', filter);
      deck.setItems(filtered());
    });
  });
})();
</script>
</body>
</html>
