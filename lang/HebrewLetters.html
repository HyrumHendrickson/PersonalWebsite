<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hebrew Alphabet · Hebrew · Lingua Antiqua</title>
<meta name="description" content="Flashcards for the twenty-two letters of the Hebrew alef-bet, with names, sounds, and final forms.">
<meta name="theme-color" content="#1a1410">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Serif+Hebrew:wght@400;600&family=Noto+Sans+Hebrew:wght@400;700&family=Miriam+Libre:wght@400;700&display=swap" rel="stylesheet">
<script>try{var t=JSON.parse(localStorage.getItem('lingua:theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="assets/lingua.css">
</head>
<body data-section="hebrew" data-app="HebrewLetters">
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>
<nav id="site-breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>
<script src="assets/lingua.js"></script>
<noscript><p class="noscript-note">This application needs JavaScript to run. Please enable it and reload the page.</p></noscript>
<main id="main" class="container app-shell">
  <header class="masthead">
    <div class="eyebrow">Alef-Bet · Biblical Hebrew</div>
    <h1>The Hebrew <em>Alphabet</em></h1>
    <p class="subtitle">Twenty-two letters, with their names, sounds, and final forms</p>
  </header>

  <section class="panel" aria-labelledby="panel-title">
    <div class="panel-header">
      <h2 class="panel-title" id="panel-title">Flashcards</h2>
      <div class="panel-meta">22 letters</div>
    </div>
    <div class="controls">
      <div class="control-group">
        <span class="label" id="lbl-dir">Direction</span>
        <div class="seg" id="dir" role="group" aria-labelledby="lbl-dir">
          <button type="button" data-mode="letter" aria-pressed="true">Letter → Name</button>
          <button type="button" data-mode="name" aria-pressed="false">Name → Letter</button>
        </div>
      </div>
      <div class="control-group">
        <label class="label" for="font-select">Letter font</label>
        <select id="font-select" class="field field--select">
          <option value="'Frank Ruhl Libre', 'Times New Roman', serif">Frank Rühl (classic print)</option>
          <option value="'Noto Serif Hebrew', 'David', serif">Noto Serif Hebrew</option>
          <option value="'Noto Sans Hebrew', 'Arial Hebrew', sans-serif">Noto Sans Hebrew</option>
          <option value="'Miriam Libre', 'Courier New', monospace">Miriam (block)</option>
          <option value="'Arial Hebrew', 'Helvetica', sans-serif">System default</option>
        </select>
      </div>
    </div>
    <div id="deck"></div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/flashdeck.js"></script>
<script>
(function () {
  'use strict';
  var L = window.Lingua, h = L.h;
  var FONT_KEY = 'lingua:hebrew-font';
  var deckEl = document.getElementById('deck');
  var fontSel = document.getElementById('font-select');
  var savedFont = L.store.get(FONT_KEY, null);
  if (savedFont) {
    for (var i = 0; i < fontSel.options.length; i++) if (fontSel.options[i].value === savedFont) fontSel.value = savedFont;
  }
  function applyFont() { deckEl.style.setProperty('--font-hebrew', fontSel.value); }
  applyFont();
  fontSel.addEventListener('change', function () { applyFont(); L.store.set(FONT_KEY, fontSel.value); });

  var LETTERS = [
    { forms: ["א"], name: "Alef", sound: "Silent (glottal stop)" },
    { forms: ["ב"], name: "Bet", sound: "B (or V without dagesh)" },
    { forms: ["ג"], name: "Gimel", sound: "G (hard, as in \"go\")" },
    { forms: ["ד"], name: "Dalet", sound: "D" },
    { forms: ["ה"], name: "He", sound: "H" },
    { forms: ["ו"], name: "Vav", sound: "V (or W in some traditions)" },
    { forms: ["ז"], name: "Zayin", sound: "Z" },
    { forms: ["ח"], name: "Chet", sound: "Ch (guttural, like Scottish \"loch\")" },
    { forms: ["ט"], name: "Tet", sound: "T" },
    { forms: ["י"], name: "Yod", sound: "Y" },
    { forms: ["כ", "ך"], name: "Kaf", sound: "K (or Kh without dagesh); ך is final form" },
    { forms: ["ל"], name: "Lamed", sound: "L" },
    { forms: ["מ", "ם"], name: "Mem", sound: "M; ם is final form" },
    { forms: ["נ", "ן"], name: "Nun", sound: "N; ן is final form" },
    { forms: ["ס"], name: "Samek", sound: "S" },
    { forms: ["ע"], name: "Ayin", sound: "Silent (guttural, distinct from Alef)" },
    { forms: ["פ", "ף"], name: "Pe", sound: "P (or F without dagesh); ף is final form" },
    { forms: ["צ", "ץ"], name: "Tsadi", sound: "Ts (as in \"cats\"); ץ is final form" },
    { forms: ["ק"], name: "Qof", sound: "Q (deep K sound)" },
    { forms: ["ר"], name: "Resh", sound: "R (slightly guttural)" },
    { forms: ["שׁ", "שׂ"], name: "Shin / Sin", sound: "Sh (dot on right) / S (dot on left)" },
    { forms: ["ת"], name: "Tav", sound: "T" }
  ];

  var mode = 'letter';
  var glyphs = function (it) { return it.forms.join('\u2002'); };

  var deck = L.flashDeck({
    root: '#deck',
    items: LETTERS,
    renderFront: function (it) {
      return mode === 'letter'
        ? h('span', { class: 'fc-form', lang: 'he' }, [glyphs(it)])
        : h('span', { class: 'fc-title' }, [it.name]);
    },
    renderBack: function (it) {
      return mode === 'letter'
        ? [h('span', { class: 'fc-back-top' }, [it.name]), h('span', { class: 'fc-back-detail' }, [it.sound])]
        : [h('span', { class: 'fc-form fc-form--md', lang: 'he' }, [glyphs(it)]), h('span', { class: 'fc-back-detail' }, [it.sound])];
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll('#dir button'), function (b) {
    b.addEventListener('click', function () {
      mode = b.getAttribute('data-mode');
      Array.prototype.forEach.call(document.querySelectorAll('#dir button'), function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      deck.setItems(LETTERS);
    });
  });
})();
</script>
</body>
</html>
