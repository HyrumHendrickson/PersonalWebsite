  WORDS = WORDS.map(function (w, i) { return { w: w, i: i }; })
    .sort(function (x, y) { return x.w.list - y.w.list || x.i - y.i; })
    .map(function (x) { return x.w; });
  var BY_ID = {};
  WORDS.forEach(function (w) { BY_ID[w.id] = w; });

  var KEY = 'hebvocab:known';
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  var known = new Set();
  try { (JSON.parse(lsGet(KEY) || '[]') || []).forEach(function (id) { if (BY_ID[id]) known.add(id); }); } catch (e) {}
  function saveKnown() { lsSet(KEY, JSON.stringify(Array.from(known))); }

  var state = {
    view: 'study', lists: [], dir: 'he', hideKnown: false,
    order: WORDS.map(function (w) { return w.id; }),
    idx: 0, flipped: false, quiz: null
  };

  function $(s) { return document.querySelector(s); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function inList(w) { return !state.lists.length || state.lists.indexOf(w.list) !== -1; }
  function pool() { return WORDS.filter(inList); }
  function getDeck() {
    return state.order.map(function (id) { return BY_ID[id]; }).filter(function (w) {
      return inList(w) && !(state.hideKnown && known.has(w.id));
    });
  }
  function hebrew(w, cls) {
    return '<div class="fc-form' + (w.small ? ' fc-form--md' : '') + (cls ? ' ' + cls : '') + '" lang="he" dir="rtl">' + w.he + '</div>';
  }
  function extra(w) {
    var parts = [];
    if (w.note) parts.push(w.note);
    if (w.pl) parts.push('Plural: <span class="hebrew-inline" lang="he" dir="rtl">' + w.pl.he + '</span> (' + w.pl.tr + ')');
    return parts.length ? '<div class="fc-note">' + parts.join('<br>') + '</div>' : '';
  }

  /* ---------- Flashcards ---------- */
  function renderStudy() {
    var el = $('#study');
    var deck = getDeck();
    var p = pool();
    var knownCount = p.filter(function (w) { return known.has(w.id); }).length;
    if (!deck.length) {
      el.innerHTML = '<div class="empty-state"><strong>Every card here is marked known</strong>' +
        'Turn off \u201cHide known cards\u201d to review them again, or clear your saved progress.</div>';
      return;
    }
    if (state.idx >= deck.length) state.idx = 0;
    if (state.idx < 0) state.idx = deck.length - 1;
    var w = deck[state.idx];
    var frontHe = state.dir === 'he';
    var front = frontHe ? hebrew(w) : '<div class="fc-title">' + w.en + '</div>';
    var back = (frontHe ? '<div class="fc-title">' + w.en + '</div>' : hebrew(w)) +
      '<div class="fc-translit">' + w.tr + '</div>' + extra(w);
    var pct = Math.round((knownCount / p.length) * 100);

    el.innerHTML =
      '<div class="progress-meta"><span>Card ' + (state.idx + 1) + ' of ' + deck.length + '</span>' +
      '<span>' + knownCount + ' of ' + p.length + ' known</span></div>' +
      '<div class="progress-bar" aria-hidden="true"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="fcard fcard--tall" id="card" role="button" tabindex="0" aria-label="Flashcard. Press Space or Enter to flip."><div class="fcard-inner">' +
        '<div class="fcard-face">' + (known.has(w.id) ? '<span class="tag tag--good fcard-badge">Known</span>' : '') + front + '<span class="fcard-hint">Tap to reveal</span></div>' +
        '<div class="fcard-face fcard-face--back">' + (known.has(w.id) ? '<span class="tag tag--good fcard-badge">Known</span>' : '') + back + '</div>' +
      '</div></div>' +
      '<div class="btn-row mt-1">' +
        '<button class="btn" id="again">Review again</button>' +
        '<button class="btn btn--primary" id="know">Know it</button>' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn btn--ghost btn--sm" id="prev" aria-label="Previous card">Previous</button>' +
        '<button class="btn btn--ghost btn--sm" id="shuffle">Shuffle</button>' +
        '<button class="btn btn--ghost btn--sm" id="next" aria-label="Next card">Next</button>' +
      '</div>' +
      '<p class="kbd-hint"><kbd>Space</kbd> flips the card \u00b7 <kbd>\u2190</kbd> <kbd>\u2192</kbd> move between cards</p>';

    var card = $('#card');
    card.classList.toggle('is-flipped', state.flipped);
    card.addEventListener('click', flip);
    card.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
    $('#know').addEventListener('click', function () { mark(true); });
    $('#again').addEventListener('click', function () { mark(false); });
    $('#prev').addEventListener('click', function () { go(-1); });
    $('#next').addEventListener('click', function () { go(1); });
    $('#shuffle').addEventListener('click', function () { state.order = shuffle(state.order); state.idx = 0; state.flipped = false; renderStudy(); });
  }
  function flip() {
    var c = $('#card');
    if (!c) return;
    state.flipped = !state.flipped;
    c.classList.toggle('is-flipped', state.flipped);
  }
  function go(d) {
    state.idx += d; state.flipped = false; renderStudy();
  }
  function mark(isKnown) {
    var deck = getDeck();
    var w = deck[state.idx];
    if (!w) return;
    if (isKnown) known.add(w.id); else known.delete(w.id);
    saveKnown();
    state.flipped = false;
    if (!(isKnown && state.hideKnown)) state.idx += 1;
    renderStudy();
  }

  /* ---------- Quiz ---------- */
  function glosses(w) {
    return w.en.toLowerCase().replace(/\(.*?\)/g, '').split(/[,;]/).map(function (g) { return g.trim(); }).filter(Boolean);
  }
  function overlaps(a, b) {
    if (a.he === b.he) return true;
    var ga = glosses(a), gb = glosses(b);
    return ga.some(function (g) { return gb.indexOf(g) !== -1; });
  }
  function makeQ(w) {
    var others = shuffle(WORDS.filter(function (o) { return o.id !== w.id && !overlaps(o, w); })).slice(0, 3);
    return { w: w, opts: shuffle([w].concat(others)), picked: null };
  }
  function startQuiz() {
    var words = shuffle(pool());
    var qs = words.map(makeQ);
    state.quiz = { qs: qs, i: 0, score: 0, missed: [], done: false };
    renderQuiz();
  }
  function optText(o) {
    return state.dir === 'he' ? '<span class="option-text">' + o.en + '</span>'
      : '<span class="option-text hebrew" lang="he" dir="rtl">' + o.he + '</span>';
  }
  function renderQuiz() {
    var el = $('#quiz');
    var q = state.quiz;
    if (!q) {
      var n = pool().length;
      el.innerHTML = '<div class="results"><h2>Multiple-choice quiz</h2>' +
        '<p>' + n + ' questions, one for each word in the selected lists.</p>' +
        '<p>' + (state.dir === 'he' ? 'Choose the English meaning of each Hebrew word.' : 'Choose the Hebrew word for each English meaning.') + '</p>' +
        '<div class="btn-row"><button class="btn btn--primary" id="start">Start quiz</button></div></div>';
      $('#start').addEventListener('click', startQuiz);
      return;
    }
    if (q.done) {
      var total = q.qs.length;
      var pct = Math.round((q.score / total) * 100);
      var missedHtml = q.missed.length
        ? '<div class="missed"><div class="missed-title">Missed words</div><ul>' + q.missed.map(function (w) {
            return '<li><span class="m-form hebrew" lang="he" dir="rtl">' + w.he + '</span><span class="m-gloss">' + w.en +
              '</span><span class="m-tr">' + w.tr + '</span></li>';
          }).join('') + '</ul></div>'
        : '<p class="mt-1">No missed words.</p>';
      el.innerHTML = '<div class="results"><h2>Quiz complete</h2><div class="results-score">' + q.score + ' <small>/ ' + total +
        '</small></div><p>' + pct + '% correct</p>' + missedHtml +
        '<div class="btn-row">' +
        (q.missed.length ? '<button class="btn" id="retry">Retry missed words</button>' : '') +
        '<button class="btn btn--primary" id="again-q">New quiz</button></div></div>';
      var r = $('#retry');
      if (r) r.addEventListener('click', function () {
        var ws = shuffle(q.missed);
        state.quiz = {
          qs: ws.map(makeQ), i: 0, score: 0, missed: [], done: false
        };
        renderQuiz();
      });
      $('#again-q').addEventListener('click', startQuiz);
      return;
    }
    var cur = q.qs[q.i];
    var w = cur.w;
    var answered = cur.picked !== null;
    var prompt = state.dir === 'he' ? hebrew(w) : '<div class="fc-title">' + w.en + '</div>';
    var opts = cur.opts.map(function (o, k) {
      var cls = 'option';
      if (answered) {
        if (o.id === w.id) cls += ' is-correct';
        else if (o.id === cur.picked) cls += ' is-wrong';
      }
      return '<button class="' + cls + '" data-id="' + o.id + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="option-key" aria-hidden="true">' + (k + 1) + '</span>' + optText(o) + '</button>';
    }).join('');
    var fb = '';
    if (answered) {
      var ok = cur.picked === w.id;
      fb = '<div class="feedback ' + (ok ? 'is-correct' : 'is-wrong') + '" role="status"><strong>' + (ok ? 'Correct.' : 'Incorrect.') + '</strong> ' +
        '<span class="hebrew-inline" lang="he" dir="rtl">' + w.he + '</span> (' + w.tr + '): ' + w.en +
        (w.note ? '<br>' + w.note : '') +
        (w.pl ? '<br>Plural: <span class="hebrew-inline" lang="he" dir="rtl">' + w.pl.he + '</span> (' + w.pl.tr + ')' : '') +
        '</div><div class="btn-row mt-1"><button class="btn btn--primary" id="nextq">' +
        (q.i === q.qs.length - 1 ? 'See results' : 'Next question') + '</button></div>';
    }
    el.innerHTML =
      '<div class="progress-meta"><span>Question ' + (q.i + 1) + ' of ' + q.qs.length + '</span><span>Score ' + q.score + '</span></div>' +
      '<div class="progress-bar" aria-hidden="true"><div class="progress-fill" style="width:' + Math.round((q.i / q.qs.length) * 100) + '%"></div></div>' +
      '<div class="prompt prompt--card">' + prompt + '</div>' +
      '<div class="options options--stack">' + opts + '</div>' + fb;
    Array.prototype.forEach.call(el.querySelectorAll('.option'), function (b) {
      b.addEventListener('click', function () { answer(b.getAttribute('data-id')); });
    });
    var nb = $('#nextq');
    if (nb) {
      nb.addEventListener('click', nextQ);
      nb.focus();
    }
  }
  function answer(id) {
    var q = state.quiz; var cur = q.qs[q.i];
    if (cur.picked !== null) return;
    cur.picked = id;
    if (id === cur.w.id) q.score += 1; else q.missed.push(cur.w);
    renderQuiz();
  }
  function nextQ() {
    var q = state.quiz;
    if (q.i === q.qs.length - 1) q.done = true; else q.i += 1;
    renderQuiz();
  }

  /* ---------- Chrome ---------- */
  /* ---------- Lists, search, vocabulary tab ---------- */
  var LIST_NUMS = Array.from(new Set(WORDS.map(function (w) { return w.list; }))).sort(function (a, b) { return a - b; });
  try {
    var savedLists = JSON.parse(lsGet('hebvocab:lists') || '[]');
    if (Array.isArray(savedLists)) state.lists = savedLists.filter(function (n) { return LIST_NUMS.indexOf(n) !== -1; });
  } catch (e) {}
  function saveLists() { lsSet('hebvocab:lists', JSON.stringify(state.lists)); }

  function renderChips() {
    var el = $('#chips');
    var html = '<button class="chip" data-l="all">All (' + WORDS.length + ')</button>';
    LIST_NUMS.forEach(function (n) {
      var c = WORDS.filter(function (w) { return w.list === n; }).length;
      html += '<button class="chip" data-l="' + n + '" aria-label="List ' + n + ', ' + c + ' words">List ' + n + '</button>';
    });
    el.innerHTML = html;
    el.addEventListener('click', function (e) {
      var b = e.target.closest('.chip');
      if (!b) return;
      var v = b.getAttribute('data-l');
      if (v === 'all') {
        state.lists = [];
      } else {
        var n = parseInt(v, 10);
        var i = state.lists.indexOf(n);
        if (i === -1) state.lists.push(n); else state.lists.splice(i, 1);
        if (state.lists.length === LIST_NUMS.length) state.lists = [];
      }
      saveLists();
      state.idx = 0; state.flipped = false; state.quiz = null;
      renderAll();
    });
  }

  function norm(str) {
    return String(str || '').replace(/[\u0591-\u05C7\u25CC]/g, '').replace(/<[^>]*>/g, ' ')
      .toLowerCase().replace(/[\u2019']/g, '').replace(/\s+/g, ' ').trim();
  }
  function haystack(w) {
    if (!w._h) {
      w._h = [norm(w.he), norm(w.tr), norm(w.en), w.pl ? norm(w.pl.he) + ' ' + norm(w.pl.tr) : '', norm(w.note)].join(' ');
    }
    return w._h;
  }
  function renderVocab() {
    var terms = norm($('#search').value).split(' ').filter(Boolean);
    var p = pool();
    var rows = p.filter(function (w) {
      if (!terms.length) return true;
      var h = haystack(w);
      return terms.every(function (t) { return h.indexOf(t) !== -1; });
    });
    var knownIn = p.filter(function (w) { return known.has(w.id); }).length;
    $('#vcount').textContent = rows.length + ' of ' + p.length + ' words shown \u00b7 ' + knownIn + ' known';
    $('#vlist').innerHTML = rows.length ? rows.map(function (w) {
      var ex = extra(w).replace('class="fc-note"', 'class="v-note"');
      return '<li class="vocab-row">' +
        '<div class="v-he' + (w.small ? ' is-small' : '') + '" lang="he" dir="rtl">' + w.he + '</div>' +
        '<div class="vmain"><div class="v-meaning">' + w.en + '</div><div class="v-translit">' + w.tr + '</div>' + ex + '</div>' +
        '<div class="v-side"><span class="tag">List ' + w.list + '</span>' +
        '<button type="button" class="btn btn--ghost btn--sm kn" data-id="' + w.id + '" aria-pressed="' + known.has(w.id) + '">Known</button></div></li>';
    }).join('') : '<li class="empty-state">No words match your search.</li>';
  }
  $('#search').addEventListener('input', renderVocab);
  $('#vlist').addEventListener('click', function (e) {
    var b = e.target.closest('.kn');
    if (!b) return;
    var id = b.getAttribute('data-id');
    if (known.has(id)) known.delete(id); else known.add(id);
    saveKnown();
    b.setAttribute('aria-pressed', String(known.has(id)));
    var p = pool();
    var knownIn = p.filter(function (w) { return known.has(w.id); }).length;
    var c = $('#vcount').textContent.split(' \u00b7 ')[0];
    $('#vcount').textContent = c + ' \u00b7 ' + knownIn + ' known';
  });
  renderChips();

  function syncControls() {
    Array.prototype.forEach.call(document.querySelectorAll('#chips .chip'), function (b) {
      var v = b.getAttribute('data-l');
      var on = v === 'all' ? !state.lists.length : state.lists.indexOf(parseInt(v, 10)) !== -1;
      b.setAttribute('aria-pressed', String(on));
    });
    Array.prototype.forEach.call(document.querySelectorAll('#seg-dir button'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === state.dir));
    });
    $('#seg-dir-wrap').hidden = state.view === 'vocab';
    $('#hide-wrap').hidden = state.view !== 'study';
    $('#hide-known').checked = state.hideKnown;
    ['study', 'quiz', 'vocab'].forEach(function (v) {
      $('#tab-' + v).setAttribute('aria-selected', String(state.view === v));
      $('#' + v).hidden = state.view !== v;
    });
  }
  function renderAll() {
    syncControls();
    if (state.view === 'study') renderStudy();
    else if (state.view === 'quiz') renderQuiz();
    else renderVocab();
  }

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { state.view = t.getAttribute('data-view'); renderAll(); });
  });
  document.querySelectorAll('#seg-dir button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.dir = b.getAttribute('data-v'); state.flipped = false; state.quiz = null; renderAll();
    });
  });
  $('#hide-known').addEventListener('change', function (e) {
    state.hideKnown = e.target.checked; state.idx = 0; state.flipped = false; renderAll();
  });
  $('#reset').addEventListener('click', function () {
    known.clear(); saveKnown(); state.idx = 0; state.flipped = false; renderAll();
  });

  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (state.view === 'study') {
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      else if (e.key === ' ' && document.activeElement === document.body) { e.preventDefault(); flip(); }
    } else if (state.view === 'quiz' && state.quiz && !state.quiz.done) {
      var cur = state.quiz.qs[state.quiz.i];
      var n = parseInt(e.key, 10);
      if (cur.picked === null && n >= 1 && n <= cur.opts.length) answer(cur.opts[n - 1].id);
    }
  });

  $('#sub-count').textContent = WORDS.length;
  renderAll();
})();
</script>
</body>
</html>
