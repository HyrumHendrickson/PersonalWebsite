<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/logo.png">
<title>Hyrum Hendrickson</title>
<style>
  :root{
    --parchment:#F2EDE1;
    --parchment-deep:#E7E0CE;
    --ink:#1C2119;
    --ink-soft:#4A5145;
    --green:#1E3A2B;
    --green-mid:#3E6B4F;
    --rule:#C8BFA7;
    --measure:68ch;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    font-size:17px;
    line-height:1.6;
  }
  .label{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.68rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--green-mid);
  }
  a{color:var(--green);text-underline-offset:3px;}
  a:hover{color:var(--green-mid);}
  :focus-visible{outline:2px solid var(--green-mid);outline-offset:3px;}

  .wrap{max-width:1000px;margin:0 auto;padding:0 24px;}

  /* Header */
  header{border-bottom:1px solid var(--rule);background:var(--parchment);}
  .masthead{display:flex;align-items:center;gap:20px;padding:36px 0 24px;}
  .masthead img{width:68px;height:68px;object-fit:contain;flex:0 0 auto;}
  h1{
    margin:0;
    font-size:clamp(1.7rem,4vw,2.3rem);
    font-weight:600;
    letter-spacing:.01em;
    line-height:1.15;
  }
  .subtitle{margin:6px 0 0;color:var(--ink-soft);font-size:.95rem;}

  /* Tabs */
  nav[role="tablist"]{display:flex;flex-wrap:wrap;gap:2px;}
  nav button{
    appearance:none;
    background:transparent;
    border:0;
    border-bottom:2px solid transparent;
    padding:10px 16px;
    margin-bottom:-1px;
    cursor:pointer;
    color:var(--ink-soft);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  nav button:hover{color:var(--green);}
  nav button[aria-selected="true"]{color:var(--green);border-bottom-color:var(--green);}

  /* Panels */
  main{padding:44px 0 72px;}
  [role="tabpanel"][hidden]{display:none;}
  [role="tabpanel"]{animation:fade .18s ease-out;}
  @keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){[role="tabpanel"]{animation:none;}}

  h2{
    margin:0 0 18px;
    font-size:1.25rem;
    font-weight:600;
    color:var(--green);
  }
  .section + .section{margin-top:44px;}
  p{max-width:var(--measure);}

  /* Entry list with marginal notes */
  .entry{
    display:grid;
    grid-template-columns:110px 1fr;
    gap:0 24px;
    padding:20px 0;
    border-top:1px solid var(--rule);
  }
  .entry:last-child{border-bottom:1px solid var(--rule);}
  .entry .margin{padding-top:5px;}
  .entry h3{margin:0;font-size:1.05rem;font-weight:600;line-height:1.35;}
  .entry p{margin:6px 0 0;color:var(--ink-soft);max-width:var(--measure);}
  .entry .venue{margin:4px 0 0;font-size:.9rem;color:var(--ink-soft);font-style:italic;}
  .entry .go{
    display:inline-block;
    margin-top:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.7rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    text-decoration:none;
    border-bottom:1px solid var(--rule);
    padding-bottom:2px;
  }
  .entry .go:hover{border-bottom-color:var(--green-mid);}

  /* Resume blocks */
  .role{margin:0;font-size:1.05rem;font-weight:600;}
  .org{margin:2px 0 0;color:var(--ink-soft);font-size:.95rem;}
  ul.plain{margin:8px 0 0;padding-left:20px;max-width:var(--measure);color:var(--ink-soft);}
  ul.plain li{margin:3px 0;}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none;}
  .tags li{
    border:1px solid var(--rule);
    background:var(--parchment-deep);
    padding:4px 10px;
    font-size:.85rem;
    color:var(--ink-soft);
  }

  /* Home */
  .lede{font-size:1.12rem;line-height:1.65;}
  .home-lead{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:0 44px;align-items:start;}
  .home-text > p:first-child{margin-top:0;}
  .portrait{margin:0;}
  .portrait img{
    display:block;
    width:100%;
    height:auto;
    background:var(--parchment-deep);
    border:1px solid var(--rule);
    padding:6px;
  }
  .portrait figcaption{margin-top:8px;}
  .facts{margin:28px 0 0;padding:0;list-style:none;max-width:var(--measure);}
  .facts li{display:grid;grid-template-columns:110px 1fr;gap:24px;padding:10px 0;border-top:1px solid var(--rule);}
  .facts li:last-child{border-bottom:1px solid var(--rule);}

  footer{border-top:1px solid var(--rule);padding:24px 0 40px;color:var(--ink-soft);font-size:.9rem;}
  .colophon{margin:0;}

  /* Contact */
  .facts a{text-decoration:none;border-bottom:1px solid var(--rule);}
  .facts a:hover{border-bottom-color:var(--green-mid);}

  @media (max-width:620px){
    .entry,.facts li{grid-template-columns:1fr;gap:4px;}
    .entry .margin{padding-top:0;}
    .masthead{gap:14px;padding:26px 0 18px;}
    .masthead img{width:52px;height:52px;}
    .home-lead{grid-template-columns:1fr;gap:0;}
    .portrait{order:-1;max-width:190px;margin:0 0 24px;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="masthead">
      <img src="logo.png" alt="">
      <div>
        <h1 id="site-name"></h1>
        <p class="subtitle" id="site-subtitle"></p>
      </div>
    </div>
    <nav role="tablist" aria-label="Sections" id="tabs"></nav>
  </div>
</header>

<main>
  <div class="wrap" id="panels"></div>
</main>

<footer>
  <div class="wrap">
    <p class="colophon" id="colophon"></p>
  </div>
</footer>

<script>
/* ============================================================
   SITE DATA — edit this object only. Everything below renders it.
   To add an item, copy an existing entry in the relevant array.
   Any field left as "" is simply not rendered.
   ============================================================ */
const SITE = {

  name: "Hyrum Hendrickson",
  subtitle: "Graduating in Spring 27 with a BS in Mathematics",

  /* Shown above the list on the Contact page. Set to "" to omit. */
  contactIntro: "The fastest way to reach me is email. I read everything and answer most messages within a few days.",

  contact: [
    { label: "Email",    url: "mailto:hendrickson.hyrum@gmail.com",         text: "hendrickson.hyrum@gmail.com" },
    { label: "GitHub",   url: "https://github.com/HyrumHendrickson",    text: "github.com/HyrumHendrickson" },
    { label: "LinkedIn", url: "https://linkedin.com/in/Hyrum-Hendrickson-3ab56532b", text: "linkedin.com/in/Hyrum-Hendrickson-3ab56532b" }
  ],

  home: {
    /* Portrait on the home page. Set src to "" to hide it. */
    portrait: {
      src: "hyrum.jpg",
      alt: "Portrait of Hyrum Hendrickson",
      caption: ""
    },
    paragraphs: [
      "I study mathematics at Brigham Young University\u2013Idaho, with a cluster in ancient languages. I currently work as an applications engineer for the IT Department at BYUI, where I manage several hundred computers.",
      "Most of my work is in Applied Mathematics, statistics, data analysis, and software engineering. During down time I enjoy writing about ancient culture and history, most recently I've done some critical textual analysis for the BYU New Testamant Commentary.",
      "On weekends my wife and I often go camping. We also enjoy hiking, fishing, gardening, and playing chess. Thanks for checking out my website, if you have any questions, please reach out!"
    ]
  },

  education: [
    {
      role: "B.S. Mathematics",
      org: "Brigham Young University\u2013Idaho",
      dates: "Expected Graduation Spring 2027",
      points: [
        "Cluster in ancient languages: Greek, Hebrew, Latin.",
        "4.0 GPA."
      ]
    }
  ],

  experience: [
    {
      role: "Applications Engineer",
      org: "Information Technology Department at BYUI",
      dates: "2026\u2013Current",
      points: [
        "We manage several hundred campus computers.",
        "We Write PowerShell and Zsh scripts for deployment, configuration, and maintenance."
      ]
    },
    {
      role: "Teaching Assistant",
      org: "Humanities Department at BYUI",
      dates: "2026",
      points: ["Taught classes, graded papers, tutored students."]
    },
     {
      role: "Analyst",
      org: "Information Technology Department at BYUI",
      dates: "2025\u20132026",
      points: ["Worked in call center fixing technology for students, emplyoees, and alumni."]
    },
    {
      role: "Library Aide, Special Collections",
      org: "David O. McKay Library at BYUI",
      dates: "2024\u20132025",
      points: ["Worked on database system, website, and data integrity."]
    }
  ],

  leadership: [
    {
      role: "President",
      org: "BYUI Philosophical Society",
      dates: "",
      points: ["Led discussions, planned meetings, manageed budget."]
    },
    {
      role: "Vice President",
      org: "BYUI Computing Society",
      dates: "",
      points: ["Taught workshop course on Python and tutored new students."]
    },
    {
      role: "Project Manager",
      org: "BYUI Data Science Society",
      dates: "",
      points: [
        "Led a research project for WECC on predicting extreme weather."
      ]
    }
  ],

  competitions: [
    {
      role: "The Mathematical Contest in Modeling",
      org: "2025",
      dates: "",
      points: []
    },
    {
      role: "BYUI Hackathons",
      org: "2024 & 2025",
      dates: "",
      points: []
    }
  ],

  certifications: [
    {
      role: "Technician Class Radio License",
      org: "Issued by the Federal Communications Commission",
      dates: "",
      points: []
    }
  ],

  skills: [
    {
      heading: "Programming languages",
      items: ["Python","R","SQL","C","C++","C#","Java","JavaScript","HTML","CSS"]
    },
    {
      heading: "Areas",
      items: ["Data Science","Statistics","Applied Mathematics","Software Engineering","Modern Mathematics and Proofs", "Formal Logic"]
    },
    {
      heading: "Systems",
      items: ["OS Deployment and Administration","Linux Kernel","Virtual Machines","PowerShell","Zsh","Bash"]
    },
    {
      heading: "Ancient languages and History",
      items: [ "Historiography", "Critical Textual Analysis", "Stylometry", "Patristics", "Greek Religion and Philosophy"]
    }
  ],

  publications: [
    /*
    {
      title: "Research Assistant",
      note: "20XX",
      venue: "BYU New Testament Commentary",
      description: "Research assistant on the commentary series. Credited for the writing on the synoptic problem in the Matthew volume.",
      link: "",
      linkText: "View publication"
    },
    {
      title: "Stylometry of the Book of Mormon",
      note: "20XX",
      venue: "The Interpreter Foundation",
      description: "A stylometric study of the Book of Mormon text.",
      link: "",
      linkText: "View publication"
    },
    */
    {
      title: "A Statistical Analysis of the Synoptic Problem",
      note: "",
      venue: "COMING SOON",
      description: "A statistical comparison of Matthew, Mark, and Luke used to test the proposed source relationships between them.",
      link: "",
      linkText: "View publication"
    }
      
  ],

  /* Tab order. To add a tab: add an id/label here and a matching
     case in renderPanel() below. */
  tabs: [
    { id: "home",         label: "Home" },
    { id: "resume",       label: "Resume" },
    { id: "publications", label: "Publications" },
    { id: "contact",      label: "Contact" }
  ]
};

/* ============================================================
   RENDERING
   ============================================================ */
const esc = s => String(s).replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
));

function entry(item){
  return `
    <article class="entry">
      <div class="margin"><span class="label">${esc(item.note || "")}</span></div>
      <div>
        <h3>${esc(item.title)}</h3>
        ${item.venue ? `<p class="venue">${esc(item.venue)}</p>` : ""}
        ${item.description ? `<p>${esc(item.description)}</p>` : ""}
        ${item.link ? `<a class="go" href="${esc(item.link)}">${esc(item.linkText || "Open")} \u2192</a>` : ""}
      </div>
    </article>`;
}

function position(p){
  return `
    <article class="entry">
      <div class="margin"><span class="label">${esc(p.dates || "")}</span></div>
      <div>
        <p class="role">${esc(p.role)}</p>
        <p class="org">${esc(p.org)}</p>
        ${p.points && p.points.length
          ? `<ul class="plain">${p.points.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`
          : ""}
      </div>
    </article>`;
}

function portrait(pic){
  if (!pic || !pic.src) return "";
  return `
    <figure class="portrait">
      <img src="${esc(pic.src)}" alt="${esc(pic.alt || SITE.name)}">
      ${pic.caption ? `<figcaption class="label">${esc(pic.caption)}</figcaption>` : ""}
    </figure>`;
}

function renderPanel(id){
  switch(id){
    case "home":
      return `
        <section class="section home-lead">
          <div class="home-text">
            ${SITE.home.paragraphs.map((t,i) =>
              `<p class="${i === 0 ? "lede" : ""}">${esc(t)}</p>`).join("")}
          </div>
          ${portrait(SITE.home.portrait)}
        </section>`;

        case "resume":
      return `
        <section class="section">
          <h2>Education</h2>
          ${SITE.education.map(position).join("")}
        </section>
        <section class="section">
          <h2>Skills</h2>
          ${SITE.skills.map(g => `
            <div style="margin-top:18px">
              <span class="label">${esc(g.heading)}</span>
              <ul class="tags">${g.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
            </div>
          `).join("")}
        </section>
        <section class="section">
          <h2>Experience</h2>
          ${SITE.experience.map(position).join("")}
        </section>
        <section class="section">
          <h2>Leadership</h2>
          ${SITE.leadership.map(position).join("")}
        </section>
        <section class="section">
          <h2>Competitions</h2>
          ${SITE.competitions.map(position).join("")}
        </section>
        <section class="section">
          <h2>Certifications</h2>
          ${SITE.certifications.map(position).join("")}
        </section>`;

    case "publications":
      return `
        <section class="section">
          <h2>Publications</h2>
          ${SITE.publications.map(entry).join("")}
        </section>`;

    case "contact":
      return `
        <section class="section">
          <h2>Contact</h2>
          ${SITE.contactIntro ? `<p>${esc(SITE.contactIntro)}</p>` : ""}
          <ul class="facts">
            ${SITE.contact.map(c => `
              <li>
                <span class="label">${esc(c.label)}</span>
                <span><a href="${esc(c.url)}">${esc(c.text)}</a></span>
              </li>`).join("")}
          </ul>
        </section>`;

    default:
      return `<section class="section"><p>Nothing here yet.</p></section>`;
  }
}

/* Header and contact */
document.getElementById("site-name").textContent = SITE.name;
document.getElementById("site-subtitle").textContent = SITE.subtitle;
document.querySelector(".masthead img").alt = SITE.name + " logo";
document.getElementById("colophon").textContent =
  "\u00A9 " + new Date().getFullYear() + " " + SITE.name;

/* Tabs */
const tabBar = document.getElementById("tabs");
const panelBox = document.getElementById("panels");

tabBar.innerHTML = SITE.tabs.map((t,i) => `
  <button role="tab" id="tab-${t.id}" aria-controls="panel-${t.id}"
          aria-selected="false" tabindex="-1">${esc(t.label)}</button>
`).join("");

panelBox.innerHTML = SITE.tabs.map(t => `
  <div role="tabpanel" id="panel-${t.id}" aria-labelledby="tab-${t.id}" tabindex="0" hidden>
    ${renderPanel(t.id)}
  </div>
`).join("");

const buttons = [...tabBar.querySelectorAll("button")];

function show(id, push){
  const valid = SITE.tabs.some(t => t.id === id) ? id : SITE.tabs[0].id;
  SITE.tabs.forEach(t => {
    const on = t.id === valid;
    const btn = document.getElementById("tab-" + t.id);
    btn.setAttribute("aria-selected", on);
    btn.tabIndex = on ? 0 : -1;
    document.getElementById("panel-" + t.id).hidden = !on;
  });
  if (push && location.hash.slice(1) !== valid) history.pushState(null, "", "#" + valid);
  document.title = SITE.name + " \u2014 " +
    SITE.tabs.find(t => t.id === valid).label;
}

buttons.forEach((btn, i) => {
  btn.addEventListener("click", () => show(SITE.tabs[i].id, true));
  btn.addEventListener("keydown", e => {
    const keys = {ArrowRight:1, ArrowLeft:-1, Home:"first", End:"last"};
    if (!(e.key in keys)) return;
    e.preventDefault();
    let n = keys[e.key] === "first" ? 0
          : keys[e.key] === "last"  ? buttons.length - 1
          : (i + keys[e.key] + buttons.length) % buttons.length;
    buttons[n].focus();
    show(SITE.tabs[n].id, true);
  });
});

window.addEventListener("hashchange", () => show(location.hash.slice(1), false));
show(location.hash.slice(1) || SITE.tabs[0].id, false);
</script>
</body>
</html>
